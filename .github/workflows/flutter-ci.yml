name: Flutter CI

# Required check for pull requests: analyzer errors, unit tests, and an installable
# release-mode APK. The APK is signed with the release key when the KEYSTORE_* secrets are
# set, otherwise with the debug key (fine for staging installs, not for Play).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned: 3.50 requires Gradle >= 9.3.1 and the app is on Gradle 8.14. Bump this together
      # with android/gradle/wrapper/gradle-wrapper.properties.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze (errors fail; warnings and infos are reported)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests (ratchet against test/ci/known-failures.txt)
        run: |
          if find test -name '*_test.dart' | grep -q .; then
            flutter test --file-reporter json:test-report.json || true
            python3 .github/scripts/flutter_ratchet.py test-report.json test/ci/known-failures.txt | tee -a "$GITHUB_STEP_SUMMARY"
            exit "${PIPESTATUS[0]}"
          else
            echo "No tests."
          fi

      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Package ID and signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo '### APK'
            echo '```'
            "$AAPT" dump badging "$APK" | grep -E "^package:"
            "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
            ls -l "$APK"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
